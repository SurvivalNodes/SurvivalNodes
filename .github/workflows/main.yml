name: Ubuntu QEMU OVMF SWTPM Tmate

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: System Information
        run: |
          echo "===== OS ====="
          cat /etc/os-release

          echo "===== CPU ====="
          lscpu

          echo "===== RAM ====="
          free -h

          echo "===== DISK ====="
          df -h

      - name: Update System
        run: |
          sudo apt update

      - name: Install Python 3.13
        run: |
          sudo apt install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update

          sudo apt install -y \
            python3.13 \
            python3.13-full \
            python3.13-venv

          python3.13 --version

          python3.13 -m ensurepip --upgrade || true
          python3.13 -m pip install --upgrade pip

          python3.13 -m pip install \
            Flask \
            Flask-Bcrypt \
            Flask-SocketIO \
            Flask-Sock \
            requests \
            psutil \
            paramiko \
            aiohttp \
            websockets \
            colorama \
            pyyaml

      - name: Install QEMU OVMF SWTPM and Tools
        run: |
          sudo apt install -y \
            qemu-kvm \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            cpu-checker \
            curl \
            wget \
            git \
            unzip \
            zip \
            nano \
            htop \
            tmux \
            screen \
            tmate

      - name: Verify Environment
        run: |
          echo "===== KVM ====="
          kvm-ok || true

          echo
          echo "===== /dev/kvm ====="
          ls -la /dev/kvm || true

          echo
          echo "===== OVMF ====="
          find /usr/share -name "*OVMF*.fd" 2>/dev/null || true

          echo
          echo "===== SWTPM ====="
          swtpm --version || true

          echo
          echo "===== QEMU ====="
          qemu-system-x86_64 --version

      - name: Start Tmate Session
        run: |
          tmate -F &
          sleep 20

          echo "================================="
          echo "TMATE SSH"
          echo "================================="
          tmate display -p '#{tmate_ssh}'

          echo
          echo "================================="
          echo "TMATE WEB"
          echo "================================="
          tmate display -p '#{tmate_web}'

          echo
          echo "Workflow running..."
          tail -f /dev/null
